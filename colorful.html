<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colorful Grid Test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    overflow: auto;
  }

  .field {
    position: relative;
    width: 4000px;
    height: 4000px;
  }

  .box {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font: 12px/1.2 monospace;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    user-select: none;
  }
</style>
</head>
<body>
<div class="field" id="field"></div>

<script>
  const field = document.getElementById('field');

  // Deterministic PRNG (mulberry32) so the layout is identical on every load.
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(42);

  const cols = 25;
  const rows = 25;
  const cellW = 160;
  const cellH = 160;
  const maxJitter = 60;   // how far a box can drift from its grid slot
  const minSize = 40;
  const maxSize = 120;

  // Test change: shift one specific box left by 50px.
  /*
  const shiftRow = 12;
  const shiftCol = 12;
  const shiftAmountX = -50;
*/
  let n = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const hue = Math.floor(rand() * 360);
      const sat = 65 + Math.floor(rand() * 30);
      const light = 45 + Math.floor(rand() * 20);

      const size = minSize + rand() * (maxSize - minSize);

      const jitterX = (rand() * 2 - 1) * maxJitter;
      const jitterY = (rand() * 2 - 1) * maxJitter;

      let x = c * cellW + jitterX;
      const y = r * cellH + jitterY;

      if (r === shiftRow && c === shiftCol) {
        x += shiftAmountX;
      }

      const box = document.createElement('div');
      box.className = 'box';
      box.style.left = x + 'px';
      box.style.top = y + 'px';
      box.style.width = size + 'px';
      box.style.height = size + 'px';
      box.style.background = `hsl(${hue}, ${sat}%, ${light}%)`;
      box.textContent = ++n;

      field.appendChild(box);
    }
  }
</script>
</body>
</html>
